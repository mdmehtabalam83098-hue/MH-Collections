
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MH Collection | Shop Management</title>

  <meta
    name="description"
    content="MH Collection ladies' clothing shop inventory, stock management, sales and billing system."
  >

  <meta name="theme-color" content="#74264d">

  <!-- Existing stylesheet -->
  <link rel="stylesheet" href="./style.css">

  <!-- Fallback layout and editable form styling -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #faf7f9;
      color: #292329;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      display: block;
      width: 100%;
      min-height: 100vh;
      pointer-events: auto;
    }

    #mh-content,
    #mh-page,
    #mh-content form,
    #mh-content label {
      pointer-events: auto;
    }

    #mh-content input,
    #mh-content select,
    #mh-content textarea {
      display: block;
      width: 100%;
      min-height: 42px;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #b9aab2;
      border-radius: 6px;
      background: #fff;
      color: #222;
      font: inherit;
      pointer-events: auto;
      user-select: text;
      -webkit-user-select: text;
    }

    #mh-content input:focus,
    #mh-content select:focus,
    #mh-content textarea:focus {
      outline: 2px solid #74264d;
      outline-offset: 1px;
      border-color: #74264d;
    }

    #mh-content button {
      min-height: 40px;
      cursor: pointer;
      pointer-events: auto;
      font: inherit;
    }

    .site-footer {
      max-width: 1100px;
      margin: 20px auto;
      padding: 12px 20px;
      color: #6e6268;
      font-size: 13px;
      text-align: center;
    }

    @media print {
      .site-footer {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- JavaScript application renders here -->
  <div id="app">
    <noscript>
      Please enable JavaScript in your browser to use MH Collection.
    </noscript>
  </div>

  <footer class="site-footer">
    MH Collection — Ladies' Clothing Shop Management
  </footer>

  <!-- Load scripts in this exact order -->
  <script src="./db.js"></script>
  <script src="./billing.js"></script>
  <script src="./app.js"></script>

</body>
</html>
